# Example reverse proxy for Pererecos Stats.
# Copy and fill in YOUR_DOMAIN and /path/to/pererecos-stats.
# Production on tossemideia.cloud lives in the host nginx config, not this file.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

upstream pererecos_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Optional: terminate TLS in front of this (Cloudflare, Caddy, certbot).

    location /pererecos-stats {
        alias /path/to/pererecos-stats/frontend;
        index index.html;
        try_files $uri $uri/ /pererecos-stats/index.html;
    }

    location /static/ {
        alias /path/to/pererecos-stats/frontend/;
    }

    location /api/v1/export/ {
        limit_req zone=api_limit burst=3 nodelay;
        limit_conn api_conn 5;
        proxy_pass http://pererecos_api/api/v1/export/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    location /api/v1/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_conn api_conn 10;
        proxy_pass http://pererecos_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }
}
